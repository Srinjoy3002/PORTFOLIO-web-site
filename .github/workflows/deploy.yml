name: Deploy Portfolio
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Inject Firebase Secrets
        run: |
          sed -i "s|FB_API_KEY|${{ secrets.FB_API_KEY }}|g" index.html
          sed -i "s|FB_AUTH_DOMAIN|${{ secrets.FB_AUTH_DOMAIN }}|g" index.html
          sed -i "s|FB_DATABASE_URL|${{ secrets.FB_DATABASE_URL }}|g" index.html
          sed -i "s|FB_PROJECT_ID|${{ secrets.FB_PROJECT_ID }}|g" index.html
          sed -i "s|FB_STORAGE_BUCKET|${{ secrets.FB_STORAGE_BUCKET }}|g" index.html
          sed -i "s|FB_MESSAGING_SENDER_ID|${{ secrets.FB_MESSAGING_SENDER_ID }}|g" index.html
          sed -i "s|FB_APP_ID|${{ secrets.FB_APP_ID }}|g" index.html
          
          # Create a clean deployment directory
          mkdir deploy
          cp index.html deploy/index.html
          cp Srinjoy_Tambuli_CV.pdf deploy/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
